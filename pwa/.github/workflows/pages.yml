# Terbitkan folder ini ke GitHub Pages (HTTPS otomatis, syarat PWA bisa dipasang).
# Pengaturan satu kali: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Terbitkan PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan folder terbit
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
